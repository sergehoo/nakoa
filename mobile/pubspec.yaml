name: printhub_mobile
description: PrintHub — Application mobile (client, livreur, agent atelier)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== State management =====
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ===== Networking =====
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0
  retry: ^3.1.2

  # ===== Routing =====
  go_router: ^17.2.3

  # ===== Persistence =====
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ===== UI / UX =====
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  pinput: ^6.0.2

  # ===== Notifications =====
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0

  # ===== Géolocalisation =====
  geolocator: ^14.0.2
  permission_handler: ^12.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # ===== Capture =====
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  signature: ^6.3.0

  # ===== Misc =====
  intl: ^0.20.2
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1
  collection: ^1.18.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.1.0
  build_runner: ^2.4.11
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
