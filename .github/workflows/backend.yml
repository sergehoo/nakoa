name: Backend CI

on:
  push:
    branches: [main, staging]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main, staging]
    paths: ['backend/**']

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: printhub_test
          POSTGRES_USER: printhub
          POSTGRES_PASSWORD: printhub
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf2.0-0 binutils libproj-dev gdal-bin
      - run: pip install -r requirements/dev.txt
      - env:
          DATABASE_URL: postgres://printhub:printhub@localhost:5432/printhub_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: 1
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit safety
      - run: bandit -r apps/ config/ -f json -o bandit-report.json || true
      - run: safety check --json --output safety-report.json || true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
