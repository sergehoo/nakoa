

x-django-base: &django-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      REQUIREMENTS: dev
  image: printhub/backend:dev
  env_file: .env
  volumes:
    - ./:/app
    - django-static:/app/staticfiles
    - django-media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ===== Reverse proxy =====
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [default]

  # ===== Database =====
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printhub}
      POSTGRES_USER: ${POSTGRES_USER:-printhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printhub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== Cache / Broker / Channel layer =====
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== Object storage =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY_ID:-printhub}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_ACCESS_KEY:-printhub-secret-key}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Initialise les buckets MinIO automatiquement
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_S3_ACCESS_KEY_ID:-printhub} ${AWS_S3_SECRET_ACCESS_KEY:-printhub-secret-key};
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-printhub-media};
      mc mb --ignore-existing local/printhub-private;
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-printhub-media};
      exit 0;
      "

  # ===== Search =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  # ===== Django API (HTTP) =====
  api:
    <<: *django-base
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --reload
               --access-logfile -"
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.printhub.local`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # ===== Django WebSocket (ASGI) =====
  ws:
    <<: *django-base
    command: >
      sh -c "uvicorn config.asgi:application
              --host 0.0.0.0
              --port 8001
              --reload"
    ports:
      - "8001:8001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=Host(`ws.printhub.local`)"
      - "traefik.http.services.ws.loadbalancer.server.port=8001"

  # ===== Celery workers =====
  worker:
    <<: *django-base
    command: celery -A config worker -Q default,notifications,documents -l info --concurrency=4
    ports: []

  worker-ai:
    <<: *django-base
    command: celery -A config worker -Q ai -l info --concurrency=2
    ports: []

  worker-heavy:
    <<: *django-base
    command: celery -A config worker -Q heavy -l info --concurrency=2
    ports: []

  beat:
    <<: *django-base
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    ports: []

  flower:
    <<: *django-base
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  es-data:
  django-static:
  django-media:

networks:
  default:
    name: printhub-net
