[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "S", "ASYNC", "I", "N", "DJ"]
ignore = ["S101", "S105", "S106", "S107", "DJ001", "S311"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101", "S105", "S106", "S107"]
"**/settings/*.py" = ["E501", "F401", "F403", "F405"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''/(migrations|\.venv|venv|build|dist)/'''

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db -ra --strict-markers"
markers = [
    "slow: tests lents",
    "integration: tests d'intégration",
    "unit: tests unitaires",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
