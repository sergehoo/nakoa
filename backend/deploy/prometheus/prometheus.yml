global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: printhub-prod
    region: ci-abj-1

scrape_configs:
  - job_name: 'printhub-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  - job_name: 'printhub-ws'
    static_configs:
      - targets: ['ws:8001']

  - job_name: 'celery'
    static_configs:
      - targets: ['flower:5555']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml
