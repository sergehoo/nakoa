version: "3.9"

# Production overlay — à utiliser avec docker-compose.yml
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-django-prod: &django-prod
  image: ghcr.io/printhub/backend:${VERSION:-latest}
  restart: always
  env_file: .env.prod
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  traefik:
    image: traefik:v3.0
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=ops@printhub.io"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/letsencrypt:/letsencrypt

  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 4G

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru

  api:
    <<: *django-prod
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --threads 2
               --worker-class gthread
               --access-logfile -
               --error-logfile -"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.printhub.io`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    deploy:
      replicas: 3

  ws:
    <<: *django-prod
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=Host(`ws.printhub.io`)"
      - "traefik.http.routers.ws.entrypoints=websecure"
      - "traefik.http.routers.ws.tls.certresolver=le"
      - "traefik.http.services.ws.loadbalancer.server.port=8001"

  worker:
    <<: *django-prod
    command: celery -A config worker -Q default,notifications,documents -l info --concurrency=8 --max-tasks-per-child=500
    deploy:
      replicas: 2

  worker-ai:
    <<: *django-prod
    command: celery -A config worker -Q ai -l info --concurrency=2 --max-tasks-per-child=100

  worker-heavy:
    <<: *django-prod
    command: celery -A config worker -Q heavy -l info --concurrency=2 --max-tasks-per-child=200

  beat:
    <<: *django-prod
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres-data:
  redis-data:
  minio-data:
  es-data:
